#:schema https://starship.rs/config-schema.json
#:tombi format.disabled = true

format = """
[](surface0)\
$os\
$username\
[](bg:peach fg:surface0)\
$directory\
[](fg:peach bg:yellow)\
$git_branch\
$git_status\
[](fg:yellow bg:green)\
[](fg:green bg:sky)\
$c\
$conda\
$rust\
$golang\
$nodejs\
$python\
[](fg:sky bg:blue)\
$docker_context\
[](fg:blue bg:pink)\
${custom.clock-icon}\
$time\
[](fg:pink)\
$status\
$line_break\
$character
"""
continuation_prompt = "[❯❯](bright-black) "
scan_timeout = 500
palette = "catppuccin_mocha"


[palettes.catppuccin_mocha]
  base      = "#1e1e2e"
  blue      = "#89b4fa"
  crust     = "#11111b"
  flamingo  = "#f2cdcd"
  green     = "#a6e3a1"
  lavender  = "#b4befe"
  mantle    = "#181825"
  maroon    = "#eba0ac"
  orange    = "#cba6f7"
  overlay0  = "#6c7086"
  overlay1  = "#7f849c"
  overlay2  = "#9399b2"
  peach     = "#fab387"
  pink      = "#f5c2e7"
  red       = "#f38ba8"
  rosewater = "#f5e0dc"
  sapphire  = "#74c7ec"
  sky       = "#89dceb"
  subtext0  = "#a6adc8"
  subtext1  = "#bac2de"
  surface0  = "#313244"
  surface1  = "#45475a"
  surface2  = "#585b70"
  teal      = "#94e2d5"
  text      = "#cdd6f4"
  yellow    = "#f9e2af"

[os]
  disabled = false
  style    = "bg:surface0 fg:text"

  # tombi: format.rules.table-keys-order = "ascending"
  [os.symbols]
    Alpine  = ""
    Amazon  = ""
    Android = ""
    Arch    = ""
    Artix   = ""
    CentOS  = ""
    Debian  = ""
    Fedora  = ""
    Gentoo  = ""
    Linux   = ""
    Macos   = ""
    Manjaro = ""
    Mint    = "󰣭"
    Redhat  = "󱄛"
    SUSE    = ""
    Ubuntu  = ""
    Windows = ""

[username]
  show_always = true
  format      = "[ $user ]($style)"
  style_root  = "bg:surface0 fg:text"
  style_user  = "bg:surface0 fg:text"

[directory]
  truncation_length = 1
  truncation_symbol = "…/"
  format            = "[ $path ]($style)"
  style             = "fg:mantle bg:peach"

[git_branch]
  symbol = ""
  format = "[ $symbol $branch ]($style)"
  style  = "fg:base bg:yellow"

[git_status]
  ahead    = "󱦲${count}"
  behind   = "󱦳${count}"
  diverged = "󱦲${ahead_count}󱦳${behind_count}"
  format   = "[($all_status$ahead_behind )]($style)"
  style    = "fg:base bg:yellow"

[nodejs]
  symbol = ""
  format = "[ $symbol( $version) ]($style)"
  style  = "fg:base bg:sky"

[c]
  symbol = ""
  format = "[ $symbol( $version) ]($style)"
  style  = "fg:base bg:sky"

[cpp]
  symbol = ""
  format = "[ $symbol( $version) ]($style)"
  style  = "fg:base bg:sky"

[rust]
  symbol = ""
  format = "[ $symbol( $version) ]($style)"
  style  = "fg:base bg:sky"

[golang]
  symbol = ""
  format = "[ $symbol( $version) ]($style)"
  style  = "fg:base bg:sky"

[python]
  symbol = ""
  format = "[ $symbol( $version) ]($style)"
  style  = "fg:base bg:sky"

[time]
  disabled    = false
  time_format = "%R"
  format      = "[ $time ]($style)"
  style       = "fg:mantle bg:pink"

# Taken from: https://github.com/starship/starship/discussions/1252#discussioncomment-9914579
[custom.clock-icon]
  command = 'h=""; echo ${h:$(date +%l)%12:1}'
  when    = true
  format  = "[ $output]($style)"
  shell   = ["sh"]
  style   = "fg:base bg:pink"

[status]
  disabled       = false
  failure_style  = "fg:red"
  success_style  = "fg:green"
  success_symbol = ""
  symbol         = ""
  format         = "[ $symbol]($style)"

[line_break]
  disabled = false
