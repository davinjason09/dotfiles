# yaml-language-server: $schema=https://raw.githubusercontent.com/amnweb/yasb/main/schema.json

watch_stylesheet: true
watch_config: true
debug: false
bars:
  primary-bar:
    enabled: true
    screens: ['*']
    class_name: 'yasb-bar'
    alignment:
      position: 'top'
      center: false
    animation:
      enabled: true
      duration: 500
    blur_effect:
      enabled: false
      acrylic: false
      dark_mode: false
      round_corners: false
      round_corners_type: 'normal'
      border_color: 'System'
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: '100%'
      height: 20
    padding:
      top: 7
      left: 7
      bottom: -2
      right: 7
    layouts:
      left:
        alignment: 'left'
        stretch: true
      center:
        alignment: 'center'
        stretch: false
      right:
        alignment: 'right'
        stretch: true
    widgets:
      left: ['glazewm-grouper', 'taskbar', 'media']
      center: ['clock']
      right: ['cava', 'panel-grouper', 'control-grouper', 'power_menu']

widgets:
  glazewm-grouper:
    type: 'yasb.grouper.GrouperWidget'
    options:
      class_name: 'glazewm-grouper'
      widgets: ['glazewm_workspaces', 'glazewm_tiling_direction']
      hide_empty: true

  quick_launch:
    type: yasb.quick_launch.QuickLaunchWidget
    options:
      label: '<span></span>'
      search_placeholder: Search applications...
      max_results: 50
      show_icons: true
      icon_size: 32
      providers:
        apps:
          enabled: true
          prefix: '*'
          priority: 0
          show_recent: true
          max_recent: 5
          show_description: true
        calculator:
          enabled: true
          prefix: '='
          priority: 1
        clipboard_history:
          enabled: true
          prefix: cb
          priority: 2
          max_items: 30
        currency:
          enabled: true
          prefix: '$'
          priority: 3
        bookmarks:
          enabled: true
          prefix: '*'
          priority: 4
          browser: all
          profile: Default
        web_search:
          enabled: true
          prefix: '?'
          priority: 5
          engine: google
        system_commands:
          enabled: true
          prefix: '>'
          priority: 6
        settings:
          enabled: true
          prefix: s
          priority: 7
        kill_process:
          enabled: true
          prefix: '!'
          priority: 8
        port_viewer:
          enabled: true
          prefix: pv
          priority: 9
          tcp_listening_only: true
          include_established: false
        file_search:
          enabled: true
          prefix: '/'
          priority: 10
          backend: auto
          show_path: true
        unit_converter:
          enabled: true
          prefix: '~'
          priority: 11
        emoji:
          enabled: true
          prefix: ':'
          priority: 12
        color:
          enabled: true
          prefix: 'c:'
          priority: 13
        world_clock:
          enabled: true
          prefix: tz
          priority: 14
        snippets:
          enabled: true
          prefix: ';'
          priority: 15
          type_delay: 200
        hacker_news:
          enabled: true
          prefix: hn
          priority: 16
          cache_ttl: 300
          max_items: 30
        dev_tools:
          enabled: true
          prefix: dev
          priority: 17
        ip_info:
          enabled: true
          prefix: ip
          priority: 18
        wsl:
          enabled: true
          prefix: wsl
          priority: 0
          show_online: true
      popup:
        width: 675
        height: 320
        blur: false
        dark_mode: true
      callbacks:
        on_left: toggle_quick_launch
      keybindings:
        - keys: ctrl+shift+space
          action: toggle_quick_launch

  glazewm_workspaces:
    type: glazewm.workspaces.GlazewmWorkspacesWidget
    options:
      offline_label:  Offline
      hide_empty_workspaces: true
      hide_if_offline: false
      enable_scroll_switching: false

  glazewm_tiling_direction:
    type: 'glazewm.tiling_direction.GlazewmTilingDirectionWidget'
    options:
      horizontal_label: '󰓡'
      vertical_label: '󰓢'

  taskbar:
    type: 'yasb.taskbar.TaskbarWidget'
    options:
      icon_size: 13
      tooltip: true
      show_only_visible: true
      strict_filtering: true
      hide_empty: true
      preview:
        enabled: true
        width: 240
        delay: 400
        padding: 6
        margin: 6
      title_label:
        enabled: true
        show: 'focused'
        min_length: 1
        max_length: 12
      ignore_apps:
        classes: ['Awake.MessageWindow', 'Windows.UI.Core.CoreWindow', 'LockScreenControllerProxyWindow']
        titles: ['Flow.Launcher']

  media:
    type: 'yasb.media.MediaWidget'
    options:
      label: '{title} - {artist}'
      max_field_size:
        label: 15
      controls_only: false
      controls_left: true
      hide_empty: true
      # callbacks
      callbacks:
        on_left: 'toggle_media_menu'
        on_middle: 'do_nothing'
        on_right: 'do_nothing'
      # thumbnail settings
      show_thumbnail: true
      thumbnail_alpha: 80
      thumbnail_padding: 8
      thumbnail_corner_radius: 6
      # icons
      icons:
        prev_track: '󰒮'
        next_track: '󰒭'
        play: ''
        pause: ''
      # scrolling settings
      scrolling_label:
        enabled: true
        update_interval_ms: 33
        style: 'left'
        separator: ' | '
        label_padding: 1
        ease_slope: 20
        ease_pos: 0.8
        ease_min: 0.5
      # media menu settings
      media_menu:
        blur: false
        alignment: 'left'
        direction: 'down'
        offset_top: 4
        offset_left: 0
        thumbnail_corner_radius: 8
        thumbnail_size: 120
        max_title_size: 80
        max_artist_size: 20
        show_source: true
        show_volume_slider: true
      media_menu_icons:
        prev_track: '󰒮'
        next_track: '󰒭'
        play: ''
        pause: ''
        mute: ''
        unmute: ''

  clock:
    type: 'yasb.clock.ClockWidget'
    options:
      label: '<span>{icon}</span>{%H:%M}'
      label_alt: '<span></span>{%a %d %b %H:%M}'
      tooltip: true
      timezones: []
      icons:
        clock_00: ''
        clock_01: ''
        clock_02: ''
        clock_03: ''
        clock_04: ''
        clock_05: ''
        clock_06: ''
        clock_07: ''
        clock_08: ''
        clock_09: ''
        clock_10: ''
        clock_11: ''
        clock_12: ''
      calendar:
        blur: false
        alignment: 'center'
        direction: 'down'
        offset_top: 4
        country_code: '$env:YASB_COUNTRY_CODE'
        show_holidays: true
        holiday_color: '#F38BA8'

  cava:
    type: 'yasb.cava.CavaWidget'
    options:
      bar_height: 15
      sleep_timer: 2
      gradient: 1
      reverse: 0
      sensitivity: 100
      foreground: '#89DCEB'
      gradient_color_1: '#74C7EC'
      gradient_color_2: '#89B4FA'
      gradient_color_3: '#CBA6F7'
      bars_number: 10
      bar_spacing: 2
      bar_width: 4
      framerate: 60
      hide_empty: true

  panel-grouper:
    type: 'yasb.grouper.GrouperWidget'
    options:
      class_name: 'panel-grouper'
      widgets: ['memory', 'cpu', 'weather']
      hide_empty: true

  memory:
    type: 'yasb.memory.MemoryWidget'
    options:
      label: 'MEM {virtual_mem_percent}%'
      label_alt: 'MEM {virtual_mem_outof}'
      update_interval: 10000
      callbacks:
        on_left: 'toggle_label'
        on_right: 'exec cmd /c Taskmgr'
      memory_thresholds:
        low: 25
        medium: 50
        high: 80
      progress_bar:
        enabled: true
        color: '#F2CDCD'
        background_color: '#6C7086'
        thickness: 2
        size: 13

  cpu:
    type: 'yasb.cpu.CpuWidget'
    options:
      label: 'CPU {info[percent][total]}%'
      label_alt: 'CPU {info[histograms][cpu_percent]}'
      update_interval: 2000
      cpu_thresholds:
        low: 25
        medium: 50
        high: 80
      histogram_icons: [
          "\u2581", # 0%
          "\u2581", # 10%
          "\u2582", # 20%
          "\u2583", # 30%
          "\u2584", # 40%
          "\u2585", # 50%
          "\u2586", # 60%
          "\u2587", # 70%
          "\u2588", # 80%+
        ]
      histogram_num_columns: 8
      callbacks:
        on_left: 'toggle_label'
        on_right: 'exec cmd /c Taskmgr'
      progress_bar:
        enabled: true
        color: '#CBA6F7'
        background_color: '#6C7086'
        thickness: 2
        size: 13

  open_meteo:
    type: yasb.open_meteo.OpenMeteoWidget
    options:
      label: <span>{icon}</span> {temp}
      label_alt: '<span>{icon}</span>{location}: <span></span>{min_temp} <span></span>{max_temp} <span>󰖌</span>{humidity}'
      update_interval: 3600
      hide_decimal: true
      units: metric
      callbacks:
        on_left: toggle_card
        on_middle: do_nothing
        on_right: toggle_label
      icons:
        sunnyDay: 󰖨
        clearNight: 
        cloudyDay: 
        cloudyNight: 
        drizzleDay: 󰙾
        drizzleNight: 󰙾
        rainyDay: 
        rainyNight: 
        snowyDay: 󰖘
        snowyNight: 󰖘
        foggyDay: 
        foggyNight: 
        thunderstormDay: 
        thunderstormNight: 
        default: 
      weather_card:
        blur: false
        alignment: center
        direction: down
        icon_size: 48
        show_hourly_forecast: true
        time_format: 24h
        hourly_point_spacing: 76
        hourly_icon_size: 24
        icon_smoothing: true
        temp_line_width: 2
        current_line_color: '#45475A'
        current_line_width: 2
        current_line_style: dash
        hourly_gradient:
          enabled: true
          top_color: '#8EAEE8'
          bottom_color: '#2A3E68'
        hourly_forecast_buttons:
          enabled: true
          default_view: temperature
          snow_icon: 󰖘
          rain_icon: 󰖖
          temperature_icon: 󰖙
        weather_animation:
          enabled: true
          snow_overrides_rain: true
          temp_line_animation_style: both
          rain_effect_intensity: 1
          snow_effect_intensity: 1
          scale_with_chance: true

  control-grouper:
    type: 'yasb.grouper.GrouperWidget'
    options:
      class_name: 'control-grouper'
      widgets: ['systray', 'wallpapers', 'copilot', 'wifi', 'volume', 'notifications']
      hide_empty: true

  systray:
    type: yasb.systray.SystrayWidget
    options:
      label_collapsed: '󰅁'
      label_expanded: '󰅀'
      icon_size: 12
      pin_click_modifier: shift
      use_hook: true
      show_in_popup: true
      show_unpinned: false
      show_unpinned_button: true
      show_battery: true
      popup:
        blur: false
        round_corners: false
        alignment: center
        direction: down
        offset_top: 6
        offset_left: 0

  wallpapers:
    type: 'yasb.wallpapers.WallpapersWidget'
    options:
      label: '<span>󰸉</span>'
      image_path: '$env:USERPROFILE/Pictures/Wallpaper'
      change_automatically: false
      gallery:
        enabled: true
        blur: true
        image_width: 250
        image_per_page: 5
        show_buttons: false
        orientation: 'portrait'
        image_spacing: 10
        lazy_load: true
        lazy_load_delay: 80
        lazy_load_fadein: 200
        image_corner_radius: 8
        enable_cache: true

  copilot:
    type: 'yasb.copilot.CopilotWidget'
    options:
      label: '{icon}'
      label_alt: '{used}/{allowance}'
      token: '$env:YASB_GITHUB_TOKEN'
      plan: 'pro'
      tooltip: true
      update_interval: 120
      icons:
        copilot: ''
        error: ''
      thresholds:
        warning: 75
        critical: 90
      menu:
        blur: false
        alignment: 'center'
        offset_top: 6
        offset_left: 0
        chart: true
      animation:
        enabled: true
        type: 'fadeInOut'
        duration: 200

  wifi:
    type: 'yasb.wifi.WifiWidget'
    options:
      label: '<span>{wifi_icon}</span>'
      label_alt: '<span>{wifi_icon}</span> {wifi_name}'
      update_interval: 5000
      callbacks:
        on_left: 'toggle_menu'
        on_middle: 'do_nothing'
        on_right: 'toggle_label'
      ethernet_icon: ''
      wifi_icons: [
          '󰤯', # Icon for 0% strength
          '󰤟', # Icon for 1-24% strength
          '󰤢', # Icon for 25-49% strength
          '󰤥', # Icon for 50-74% strength
          '󰤨', # Icon for 75-100% strength
        ]
      menu_config:
        blur: false
        alignment: 'center'
        direction: 'down'
        offset_top: 4
        offset_left: 0
        wifi_icons_secured: ["\ue670", "\ue671", "\ue672", "\ue673"]
        wifi_icons_unsecured: ["\uec3c", "\uec3d", "\uec3e", "\uec3f"]

  volume:
    type: 'yasb.volume.VolumeWidget'
    options:
      label: '<span>{icon}</span>'
      label_alt: '{volume}'
      tooltip: true
      audio_menu:
        blur: false
        offset_top: 4
        alignment: 'center'

  notifications:
    type: 'yasb.notifications.NotificationsWidget'
    options:
      label: '<span></span>{count}'
      label_alt: '{count} notifs'
      hide_empty: false
      tooltip: true
      callbacks:
        on_left: 'toggle_notification'
        on_middle: 'do_nothing'
        on_right: 'toggle_label'

  power_menu:
    type: 'yasb.power_menu.PowerMenuWidget'
    options:
      label: "\uf011"
      uptime: true
      blur: false
      blur_background: true
      animation_duration: 200
      button_row: 5
      buttons:
        shutdown: ["\uf011", 'Shut Down']
        restart: ["\uead2", 'Restart']
        signout: ["\udb80\udf43", 'Sign out']
        hibernate: ["\uf28e", 'Hibernate']
        sleep: ["\u23fe", 'Sleep']
        cancel: ['', 'Cancel']
