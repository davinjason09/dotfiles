watch_stylesheet: true
watch_config: true
debug: false
bars:
  primary-bar:
    enabled: true
    screens: ["*"]
    class_name: "yasb-bar"
    alignment:
      position: "top"
      center: false
    animation:
      enabled: true
      duration: 500
    blur_effect:
      enabled: false
      acrylic: false
      dark_mode: false
      round_corners: false
      round_corners_type: "normal"
      border_color: "System"
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: "100%"
      height: 20
    padding:
      top: 5
      left: 7
      bottom: 0
      right: 7
    layouts:
      left:
        alignment: "left"
        stretch: true
      center:
        alignment: "center"
        stretch: false
      right:
        alignment: "right"
        stretch: true
    widgets:
      left:
        [
          "glazewm_workspaces",
          "glazewm_tiling_direction",
          "active_window",
          "media",
        ]
      center: ["clock"]
      right:
        [
          "cava",
          "systray",
          "memory",
          "cpu",
          "weather",
          "wallpapers",
          "wifi",
          "volume",
          "battery",
          "notifications",
          "power_menu",
        ]

widgets:
  glazewm_workspaces:
    type: "glazewm.workspaces.GlazewmWorkspacesWidget"
    options:
      offline_label: "GlazeWM Offline"
      hide_empty_workspaces: true
      hide_if_offline: false

  glazewm_tiling_direction:
    type: "glazewm.tiling_direction.GlazewmTilingDirectionWidget"
    options:
      horizontal_label: "󰓡"
      vertical_label: "󰓢"

  active_window:
    type: "yasb.active_window.ActiveWindowWidget"
    options:
      label: "{win[title]}"
      label_alt: "[class_name='{win[class_name]}' exe='{win[process][name]}' hwnd={win[hwnd]}]"
      label_no_window: ""
      label_icon: true
      label_icon_size: 14
      max_length: 20
      max_length_ellipsis: "…"
      monitor_exclusive: true
      ignore_window:
        classes:
          [
            "Awake.MessageWindow",
            "Windows.UI.Core.CoreWindow",
            "LockScreenControllerProxyWindow",
          ]
        processes: ["Flow.Launcher.exe"]
    callbacks:
      on_left: "toggle_label"

  media:
    type: "yasb.media.MediaWidget"
    options:
      label: "{title} - {artist}"
      label_alt: "{artist}"
      max_field_size:
        label: 10
        label_alt: 10
      show_thumbnail: true
      controls_only: false
      controls_left: true
      hide_empty: true
      thumbnail_alpha: 80
      thumbnail_padding: 8
      thumbnail_corner_radius: 6
      icons:
        prev_track: "󰒮"
        next_track: "󰒭"
        play: ""
        pause: ""

  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "<span></span>{%a, %d %b %H:%M}"
      label_alt: "<span></span>{%A, %d %B %Y %H:%M}"
      tooltip: true
      timezones: []
      calendar:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "#89dceb"
        alignment: "center"
        direction: "down"
        distance: 6

  cava:
    type: "yasb.cava.CavaWidget"
    options:
      bar_height: 15
      sleep_timer: 2
      gradient: 1
      reverse: 0
      sensitivity: 100
      foreground: "#89dce4"
      gradient_color_1: "#89b4fa"
      gradient_color_2: "#cba6f7"
      gradient_color_3: "#f5c2e7"
      bars_number: 10
      bar_spacing: 2
      bar_width: 4
      framerate: 60
      hide_empty: true

  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      label_collapsed: ""
      label_expanded: ""
      icon_size: 12
      pin_click_modifier: "shift"
      class_name: "systray"
      show_unpinned: false
      show_unpinned_button: true
      show_battery: false
      show_volume: false
      show_network: false

  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span></span> {info[percent][total]}%"
      label_alt: "<span></span> {info[histograms][cpu_percent]}"
      update_interval: 2000
      histogram_icons:
        - '\u2581' # 0%
        - '\u2581' # 10%
        - '\u2582' # 20%
        - '\u2583' # 30%
        - '\u2584' # 40%
        - '\u2585' # 50%
        - '\u2586' # 60%
        - '\u2587' # 70%
        - '\u2588' # 80%+
      histogram_num_columns: 8
      callbacks:
        on_left: "toggle_label"
        on_right: "exec cmd /c Taskmgr"

  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "<span></span> {virtual_mem_percent}%"
      label_alt: "<span></span> {virtual_mem_outof}"
      update_interval: 10000
      callbacks:
        on_left: "toggle_label"
        on_right: "exec cmd /c Taskmgr"

  weather:
    type: "yasb.weather.WeatherWidget"
    options:
      label: "<span>{icon}</span> {temp}"
      label_alt: "<span>{icon}</span>{location}: <span></span>{min_temp},<span></span>{max_temp}, <span>󰖌</span>{humidity}"
      api_key: "$env:YASB_WEATHER_API_KEY"
      show_alerts: true
      update_interval: 600
      hide_decimal: true
      units: "metric"
      location: "$env:YASB_WEATHER_LOCATION"
      callbacks:
        on_left: "toggle_card"
        on_middle: "do_nothing"
        on_right: "toggle_label"
      icons:
        sunnyDay: "󰖨"
        clearNight: ""
        cloudyDay: ""
        cloudyNight: ""
        rainyDay: ""
        rainyNight: ""
        snowyIcyDay: ""
        snowyIcyNight: ""
        blizzardDay: ""
        blizzardNight: ""
        foggyDay: ""
        foggyNight: ""
        thunderstormDay: ""
        thunderstormNight: ""
        default: ""
      weather_card:
        blur: True
        round_corners: True
        round_corners_type: "normal"
        border_color: "#89dce4"
        alignment: "right"
        direction: "down"
        distance: 6
        icon_size: 64

  wallpapers:
    type: "yasb.wallpapers.WallpapersWidget"
    options:
      label: "<span>󰸉</span>"
      image_path: "$env:USERPROFILE/Pictures/Wallpaper"
      change_automatically: false
      update_interval: 60
      gallery:
        enabled: true
        blur: true
        image_width: 250
        image_per_page: 5
        show_buttons: false
        orientation: "portrait"
        image_spacing: 10
        lazy_load: true
        lazy_load_delay: 80
        lazy_load_fadein: 200
        image_corner_radius: 8
        enable_cache: true

  wifi:
    type: "yasb.wifi.WifiWidget"
    options:
      label: "<span>{wifi_icon}</span>"
      label_alt: "<span>{wifi_icon}</span> {wifi_name} {wifi_strength}%"
      update_interval: 5000
      callbacks:
        on_left: "toggle_label"
        on_middle: "do_nothing"
        on_right: "exec cmd.exe /c start ms-settings:network"
      ethernet_icon: ""
      wifi_icons: [
          "󰤯", # Icon for 0% strength
          "󰤟", # Icon for 1-24% strength
          "󰤢", # Icon for 25-49% strength
          "󰤥", # Icon for 50-74% strength
          "󰤨", # Icon for 75-100% strength
        ]

  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "{volume}"
      tooltip: true
      audio_menu:
        border_color: "#89dce4"

  battery:
    type: "yasb.battery.BatteryWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "<span>{icon}</span> {percent}% | {time_remaining} left"
      charging_options:
        icon_format: "{charging_icon}"
      status_icons:
        icon_charging: "󰢝"
        icon_critical: "󱃍"
        icon_low: "󰁻"
        icon_medium: "󰁿"
        icon_high: "󰂁"
        icon_full: "󰁹"

  notifications:
    type: "yasb.notifications.NotificationsWidget"
    options:
      label: "<span></span>"
      label_alt: " {count} notifications"
      hide_empty: false
      tooltip: true
      callbacks:
        on_left: "toggle_notification"
        on_middle: "do_nothing"
        on_right: "toggle_label"

  power_menu:
    type: "yasb.power_menu.PowerMenuWidget"
    options:
      label: "\uf011"
      uptime: True
      blur: False
      blur_background: True
      animation_duration: 200
      button_row: 5
      buttons:
        shutdown: ["\uf011", "Shut Down"]
        restart: ["\uead2", "Restart"]
        signout: ["\udb80\udf43", "Sign out"]
        hibernate: ["\uf28e", "Hibernate"]
        sleep: ["\u23fe", "Sleep"]
        cancel: ["", "Cancel"]
