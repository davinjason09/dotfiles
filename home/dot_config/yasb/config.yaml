watch_stylesheet: true
watch_config: true
debug: false
bars:
  primary-bar:
    enabled: true
    screens: ["*"]
    class_name: "yasb-bar"
    alignment:
      position: "top"
      center: false
    animation:
      enabled: true
      duration: 500
    blur_effect:
      enabled: false
      acrylic: false
      dark_mode: false
      round_corners: false
      round_corners_type: "normal"
      border_color: "System"
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: "100%"
      height: 20
    padding:
      top: 5
      left: 7
      bottom: 0
      right: 7
    layouts:
      left:
        alignment: "left"
        stretch: true
      center:
        alignment: "center"
        stretch: false
      right:
        alignment: "right"
        stretch: true
    widgets:
      left:
        [
          "glazewm_workspaces",
          "glazewm_tiling_direction",
          "active_window",
          "media",
        ]
      center: ["clock"]
      right:
        [
          "cava",
          "memory",
          "cpu",
          "weather",
          "systray",
          "wallpapers",
          "wifi",
          "volume",
          "notifications",
          "power_menu",
        ]

widgets:
  glazewm_workspaces:
    type: "glazewm.workspaces.GlazewmWorkspacesWidget"
    options:
      offline_label: "GlazeWM Offline"
      hide_empty_workspaces: true
      hide_if_offline: false
      enable_scroll_switching: false

  glazewm_tiling_direction:
    type: "glazewm.tiling_direction.GlazewmTilingDirectionWidget"
    options:
      horizontal_label: "󰓡"
      vertical_label: "󰓢"

  active_window:
    type: "yasb.active_window.ActiveWindowWidget"
    options:
      label: "{win[title]}"
      label_alt: "[class_name='{win[class_name]}' exe='{win[process][name]}' hwnd={win[hwnd]}]"
      label_no_window: ""
      label_icon: true
      label_icon_size: 14
      max_length: 20
      max_length_ellipsis: "…"
      monitor_exclusive: true
      ignore_window:
        classes:
          [
            "Awake.MessageWindow",
            "Windows.UI.Core.CoreWindow",
            "LockScreenControllerProxyWindow",
          ]
        processes: ["Flow.Launcher.exe"]
    callbacks:
      on_left: "toggle_label"

  media:
    type: "yasb.media.MediaWidget"
    options:
      label: "{title} - {artist}"
      max_field_size:
        label: 15
      controls_only: false
      controls_left: true
      hide_empty: true
      # callbacks
      callbacks:
        on_left: "toggle_media_menu"
        on_middle: "do_nothing"
        on_right: "do_nothing"
      # thumbnail settings
      show_thumbnail: true
      thumbnail_alpha: 80
      thumbnail_padding: 8
      thumbnail_corner_radius: 6
      # icons
      icons:
        prev_track: "󰒮"
        next_track: "󰒭"
        play: ""
        pause: ""
      # scrolling settings
      scrolling_label:
        enabled: true
        update_interval_ms: 33
        style: "left"
        separator: " | "
        label_padding: 1
        ease_slope: 20
        ease_pos: 0.8
        ease_min: 0.5
      # media menu settings
      media_menu:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "#89DCEB"
        alignment: "left"
        direction: "down"
        offset_top: 6
        offset_left: 0
        thumbnail_corner_radius: 8
        thumbnail_size: 120
        max_title_size: 80
        max_artist_size: 20
        show_source: true
      media_menu_icons:
        prev_track: "󰒮"
        next_track: "󰒭"
        play: ""
        pause: ""

  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "<span></span>{%a %d %b %H:%M}"
      label_alt: "<span></span>{%A %d %B %Y %H:%M}"
      tooltip: true
      timezones: []
      calendar:
        blur: false
        alignment: "center"
        direction: "down"
        offset_top: 6
        country_code: "$env:YASB_COUNTRY_CODE"
        show_holidays: true
        holiday_color: "#F38BA8"

  cava:
    type: "yasb.cava.CavaWidget"
    options:
      bar_height: 15
      sleep_timer: 2
      gradient: 1
      reverse: 0
      sensitivity: 100
      foreground: "#89DCEB"
      gradient_color_1: "#74C7EC"
      gradient_color_2: "#89B4FA"
      gradient_color_3: "#CBA6F7"
      bars_number: 10
      bar_spacing: 2
      bar_width: 4
      framerate: 60
      hide_empty: true

  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "MEM {virtual_mem_percent}%"
      label_alt: "MEM {virtual_mem_outof}"
      update_interval: 10000
      callbacks:
        on_left: "toggle_label"
        on_right: "exec cmd /c Taskmgr"
      progress_bar:
        enabled: true
        color: "#F2CDCD"
        background_color: "#6C7086"
        thickness: 2
        size: 13

  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "CPU {info[percent][total]}%"
      label_alt: "CPU {info[histograms][cpu_percent]}"
      update_interval: 2000
      histogram_icons: [
          "\u2581", # 0%
          "\u2581", # 10%
          "\u2582", # 20%
          "\u2583", # 30%
          "\u2584", # 40%
          "\u2585", # 50%
          "\u2586", # 60%
          "\u2587", # 70%
          "\u2588", # 80%+
        ]
      histogram_num_columns: 8
      callbacks:
        on_left: "toggle_label"
        on_right: "exec cmd /c Taskmgr"
      progress_bar:
        enabled: true
        color: "#CBA6F7"
        background_color: "#6C7086"
        thickness: 2
        size: 13

  weather:
    type: "yasb.weather.WeatherWidget"
    options:
      label: "<span>{icon}</span> {temp}"
      label_alt: "<span>{icon}</span>{location}: <span></span>{min_temp},<span></span>{max_temp}, <span>󰖌</span>{humidity}"
      api_key: "$env:YASB_WEATHER_API_KEY"
      show_alerts: true
      update_interval: 3600
      hide_decimal: true
      units: "metric"
      location: "$env:YASB_WEATHER_LOCATION"
      callbacks:
        on_left: "toggle_card"
        on_middle: "do_nothing"
        on_right: "toggle_label"
      icons:
        sunnyDay: "󰖨"
        clearNight: ""
        cloudyDay: ""
        cloudyNight: ""
        rainyDay: ""
        rainyNight: ""
        snowyIcyDay: ""
        snowyIcyNight: ""
        blizzardDay: ""
        blizzardNight: ""
        foggyDay: ""
        foggyNight: ""
        thunderstormDay: ""
        thunderstormNight: ""
        default: ""
      weather_card:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "#89DCEB"
        alignment: "right"
        direction: "down"
        distance: 6
        icon_size: 64
        show_hourly_forecast: true
        time_format: "24h"
        hourly_point_spacing: 76
        hourly_icon_size: 32
        icon_smoothing: true
        temp_line_width: 2
        current_line_color: "#585B70"
        current_line_width: 2
        current_line_style: "dot"

  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      label_collapsed: ""
      label_expanded: ""
      icon_size: 12
      pin_click_modifier: "shift"
      class_name: "systray"
      show_unpinned: false
      show_unpinned_button: true
      show_battery: true
      show_volume: false
      show_network: false

  wallpapers:
    type: "yasb.wallpapers.WallpapersWidget"
    options:
      label: "<span>󰸉</span>"
      image_path: "$env:USERPROFILE/Pictures/Wallpaper"
      change_automatically: false
      gallery:
        enabled: true
        blur: true
        image_width: 250
        image_per_page: 5
        show_buttons: false
        orientation: "portrait"
        image_spacing: 10
        lazy_load: true
        lazy_load_delay: 80
        lazy_load_fadein: 200
        image_corner_radius: 8
        enable_cache: true

  wifi:
    type: "yasb.wifi.WifiWidget"
    options:
      label: "<span>{wifi_icon}</span>"
      label_alt: "<span>{wifi_icon}</span> {wifi_name}"
      update_interval: 5000
      callbacks:
        on_left: "toggle_menu"
        on_middle: "do_nothing"
        on_right: "toggle_label"
      ethernet_icon: ""
      wifi_icons: [
          "󰤯", # Icon for 0% strength
          "󰤟", # Icon for 1-24% strength
          "󰤢", # Icon for 25-49% strength
          "󰤥", # Icon for 50-74% strength
          "󰤨", # Icon for 75-100% strength
        ]
      menu_config:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "#89DCEB"
        alignment: "center"
        direction: "down"
        offset_top: 6
        offset_left: 0
        wifi_icons_secured: ["\ue670", "\ue671", "\ue672", "\ue673"]
        wifi_icons_unsecured: ["\uec3c", "\uec3d", "\uec3e", "\uec3f"]

  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "{volume}"
      tooltip: true
      audio_menu:
        border_color: "#89DCEB"
        alignment: "center"

  notifications:
    type: "yasb.notifications.NotificationsWidget"
    options:
      label: "<span></span>"
      label_alt: " {count} notifs"
      hide_empty: false
      tooltip: true
      callbacks:
        on_left: "toggle_notification"
        on_middle: "do_nothing"
        on_right: "toggle_label"

  power_menu:
    type: "yasb.power_menu.PowerMenuWidget"
    options:
      label: "\uf011"
      uptime: true
      blur: false
      blur_background: true
      animation_duration: 200
      button_row: 5
      buttons:
        shutdown: ["\uf011", "Shut Down"]
        restart: ["\uead2", "Restart"]
        signout: ["\udb80\udf43", "Sign out"]
        hibernate: ["\uf28e", "Hibernate"]
        sleep: ["\u23fe", "Sleep"]
        cancel: ["", "Cancel"]
